<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Penalty Kings</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><span class="tag">⚽ JOGO DE PÊNALTIS</span><h1>Penalty <b>Kings</b></h1><p>Mostre sangue frio. Escolha o canto e marque!</p></div><button id="newGame">Novo jogo</button></header><section class="score"><div><small>VOCÊ</small><strong id="playerScore">0</strong></div><div class="versus">×<span id="shots">0/5</span></div><div><small>GOLEIRO</small><strong id="keeperScore">0</strong></div></section><section class="field"><div id="keeper">🧤</div><div id="ball">⚽</div><div class="goal"></div></section><section class="controls"><h2>Escolha onde chutar</h2><div class="dirs"><button data-dir="LEFT">← Esquerda</button><button data-dir="CENTER">Centro</button><button data-dir="RIGHT">Direita →</button></div><h3>Potência</h3><div class="power"><button data-power="LOW">Fraca</button><button class="active" data-power="MEDIUM">Média</button><button data-power="HIGH">Forte</button></div></section><div id="message" class="message">Novo jogo iniciado. Boa sorte!</div></main><script src="app.js"></script></body></html>
