<!doctype html>
<html lang="pt-BR">
  <!-- Preparo a página pra mostrar os acentos e ajustar o jogo à largura da tela. -->
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Penalty Kings</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <!-- O botão Novo jogo começa outra partida e zera o placar. -->
      <header>
        <div>
          <span class="tag">⚽ JOGO DE PÊNALTIS</span>
          <h1>Penalty <b>Kings</b></h1>
          <p>Mostre sangue frio. Escolha o canto e marque!</p>
        </div>
        <button id="newGame">Novo jogo</button>
      </header>
      <!-- O JavaScript atualiza estes números a cada cobrança. -->
      <section class="score">
        <div>
          <small>VOCÊ</small>
          <strong id="playerScore">0</strong>
        </div>
        <div class="versus">×<span id="shots">0/5</span>
        </div>
        <div>
          <small>GOLEIRO</small>
          <strong id="keeperScore">0</strong>
        </div>
      </section>
      <!-- A bola e o goleiro mudam de posição dentro deste campo. -->
      <section class="field">
        <div id="keeper">🧤</div>
        <div id="ball">⚽</div>
        <div class="goal">
        </div>
      </section>
      <!-- Cada botão guarda o canto do chute em data-dir. -->
      <section class="controls">
        <h2>Escolha onde chutar</h2>
        <div class="dirs">
          <button data-dir="LEFT">← Esquerda</button>
          <button data-dir="CENTER">Centro</button>
          <button data-dir="RIGHT">Direita →</button>
        </div>
        <h3>Potência</h3>
        <!-- Os botões guardam a potência em data-power. A média começa selecionada. -->
        <div class="power">
          <button data-power="LOW">Fraca</button>
          <button class="active" data-power="MEDIUM">Média</button>
          <button data-power="HIGH">Forte</button>
        </div>
      </section>
      <!-- Aqui aparece o resultado que o jogador acabou de tirar. -->
      <div id="message" class="message">Novo jogo iniciado. Boa sorte!</div>
    </main>
    <!-- Carrego o jogo depois que o placar e os botões já estão na página. -->
    <script src="app.js">
    </script>
  </body>
</html>
